name: sync-candles

on:
  schedule:
    # Hourly (was 7,37). This workflow only keeps the DASHBOARD fresh - the
    # non-critical path - so its minutes were halved to stay under the
    # 2000-min/month private-repo ceiling and free budget for the hardened
    # signal-engine. Signal evaluation never depends on this job: the engine
    # workflow syncs first on its own. Self-healing covers any skipped hour.
    - cron: "7 * * * *"
  workflow_dispatch:

# Overlapping runs cancel the older one rather than stacking.
concurrency:
  group: sync-candles
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python scripts/sync.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PYTHONUNBUFFERED: "1"
