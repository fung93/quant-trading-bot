name: sync-candles

on:
  schedule:
    - cron: "7 * * * *" # :07 past each hour - off the top-of-hour stampede, hourly candle is closed
  workflow_dispatch:

# Overlapping runs cancel the older one rather than stacking.
concurrency:
  group: sync-candles
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      # TEMPORARY diagnostic - remove once sync is green. Prints only the
      # shape of the secret values (lengths/booleans), never the values.
      - name: Diagnose secret shape
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python - <<'EOF'
          import os
          u = os.environ.get("SUPABASE_URL", "")
          k = os.environ.get("SUPABASE_SERVICE_ROLE_KEY", "")
          print("URL: len=%d starts_https=%s first3=%r has_whitespace=%s looks_like_key=%s" % (
              len(u), u.startswith("https://"), u[:3],
              any(c.isspace() for c in u), u.startswith("eyJ")))
          print("KEY: len=%d looks_like_key=%s looks_like_url=%s has_whitespace=%s" % (
              len(k), k.startswith("eyJ"), k.startswith("https://"),
              any(c.isspace() for c in k)))
          EOF

      - run: python scripts/sync.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PYTHONUNBUFFERED: "1"
