name: weekly-review

on:
  schedule:
    # Sundays 01:00 UTC = 09:00 MYT Sunday. Read-only review; a missed week
    # costs nothing (the next run's cumulative section covers it), so this
    # needs no external trigger the way the signal engine does.
    - cron: "0 1 * * 0"
  workflow_dispatch:

permissions:
  contents: write # commits the generated review markdown back to reviews/

concurrency:
  group: weekly-review
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt -r scripts/requirements-engine.txt

      - name: Generate weekly review
        run: python scripts/weekly_review.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONUNBUFFERED: "1"

      - name: Commit the review
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reviews/
          if git diff --staged --quiet; then
            echo "no review changes to commit"
          else
            git commit -m "Weekly review $(date -u +%Y-%m-%d)"
            git push
          fi
