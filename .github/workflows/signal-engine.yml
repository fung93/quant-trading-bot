name: signal-engine

on:
  schedule:
    # Two attempts (9 and 39 past) at each 4h boundary - GitHub throttles
    # scheduled runs on private repos, so a single slot can be skipped for
    # hours (observed 2026-06-15, ~5h gap). The second shot catches most
    # skips; idempotency makes a double-fire harmless. Each run syncs first,
    # so the critical decision moments stay fresh even if the hourly sync
    # workflow is skipping. This is the HARDENED critical path.
    - cron: "9,39 0,4,8,12,16,20 * * *"
  workflow_dispatch:

concurrency:
  group: signal-engine
  cancel-in-progress: false # never kill a run mid-write; runs are 4h apart

jobs:
  sync-then-signal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt -r scripts/requirements-engine.txt

      - name: Sync candles (freshness guarantee)
        run: python scripts/sync.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PYTHONUNBUFFERED: "1"

      - name: Run signal engine
        run: python scripts/signal_engine.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONUNBUFFERED: "1"
